<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البحث — Allam Veterinary Clinic</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body>
<button id="themeToggle" class="theme-toggle" type="button" aria-label="تفعيل الوضع الليلي" title="تفعيل الوضع الليلي">☀️</button>
<div id="loginView" class="login-wrap"><section class="card"><img class="clinic-logo" src="logo.png" alt="Allam Veterinary Clinic logo"><h1>البحث في ملفات العيادة</h1><p class="muted">سجّل الدخول للوصول إلى السجلات.</p><div id="loginMessage" class="message"></div><form id="loginForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button class="btn" type="submit">تسجيل الدخول</button></div></form></section></div>
<div id="appView" class="hidden"><header><div class="header-brand"><img class="header-logo" src="logo.png" alt="شعار Allam Veterinary Clinic"><div><h1>Allam Veterinary Clinic</h1><p>البحث في ملفات الملاك والحيوانات وسجل الزيارات</p></div></div><nav class="nav"><a href="index.html">الرئيسية</a><a class="active" href="search.html">البحث والسجلات</a><a href="followups.html">المتابعات</a><button id="logoutBtn" type="button">تسجيل الخروج</button></nav></header>
<main><div id="appMessage" class="message"></div><section class="card"><h2>البحث عن مالك أو حيوان</h2><form id="searchForm"><label for="query">اسم المالك أو رقم الهاتف أو اسم الحيوان</label><input id="query" placeholder="مثال: أحمد أو 010... أو سيمبا" required><div class="actions"><button class="btn" type="submit">بحث</button><button class="btn secondary" id="showAll" type="button">عرض أحدث الملفات</button></div></form></section><section class="card"><h2>النتائج</h2><div id="results" class="results"><div class="empty">اكتب كلمة للبحث أو اضغط «عرض أحدث الملفات».</div></div></section><section id="detailsCard" class="card hidden"><h2>سجل الحيوان</h2><div id="details"></div></section></main><footer>Allam Veterinary Clinic · البحث والسجلات</footer></div>
<script>
const SUPABASE_URL='https://jydptxycpptbgvgpmaoh.supabase.co';const SUPABASE_KEY='sb_publishable_BWVDzzvaa7Wl27HpIo8etA_p32nc8FZ';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:window.sessionStorage}});
const $=id=>document.getElementById(id);
function msg(el,text,type='error'){el.textContent=text;el.className='message '+type;el.style.display='block'}function clearMsg(el){el.textContent='';el.className='message';el.style.display='none'}function setLoggedIn(yes){$('loginView').classList.toggle('hidden',yes);$('appView').classList.toggle('hidden',!yes)}
let lastSearchTerm='',lastSearchAll=false;
(function(){const root=document.documentElement,b=$('themeToggle'),key='allam-vet-theme';let t='light';try{t=localStorage.getItem(key)||'light'}catch(e){}function apply(v){root.dataset.theme=v;b.textContent=v==='dark'?'🌙':'☀️';b.title=v==='dark'?'تفعيل الوضع الفاتح':'تفعيل الوضع الليلي';b.setAttribute('aria-label',b.title)}apply(t==='dark'?'dark':'light');b.onclick=()=>{const n=root.dataset.theme==='dark'?'light':'dark';apply(n);try{localStorage.setItem(key,n)}catch(e){}}})();
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();clearMsg($('loginMessage'));const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg($('loginMessage'),'تعذر تسجيل الدخول: '+error.message);return}setLoggedIn(true)});
$('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut({scope:'local'});setLoggedIn(false)});
sb.auth.getSession().then(({data,error})=>{setLoggedIn(!error&&!!data.session);if(!error&&data.session){const target=new URLSearchParams(location.search).get('animal');if(target)showAnimal(target)}});sb.auth.onAuthStateChange((_event,session)=>setLoggedIn(!!session));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function runSearch(term,all=false){lastSearchTerm=term;lastSearchAll=all;clearMsg($('appMessage'));$('results').innerHTML='<div class="empty">جارٍ البحث...</div>';$('detailsCard').classList.add('hidden');try{
 let oq=sb.from('clinic_owners').select('*').order('created_at',{ascending:false}).limit(100),aq=sb.from('clinic_animals').select('*, clinic_owners(*)').order('created_at',{ascending:false}).limit(100);
 if(!all){const safe=term.replace(/[,%()]/g,' ').trim();oq=oq.or(`full_name.ilike.%${safe}%,phone.ilike.%${safe}%`);aq=aq.ilike('name',`%${safe}%`)}
 const [or,ar]=await Promise.all([oq,aq]);if(or.error)throw or.error;if(ar.error)throw ar.error;const owners=or.data||[],animals=ar.data||[];let html='';
 for(const o of owners){const related=animals.filter(a=>a.owner_id===o.id);html+=`<article class="result"><h3>👤 ${esc(o.full_name)}</h3><div>${o.phone?`<span class="pill">📞 ${esc(o.phone)}</span>`:''}${o.address?`<span class="pill">${esc(o.address)}</span>`:''}</div><p class="muted">الحيوانات الظاهرة في النتائج: ${related.length}</p>${related.map(animalButton).join('')}<div class="actions"><button type="button" class="btn secondary" data-edit-owner="${esc(o.id)}">تعديل بيانات المالك</button><button type="button" class="btn danger" data-delete-owner="${esc(o.id)}">حذف بيانات المالك</button></div></article>`}
 for(const a of animals){if(!owners.some(o=>o.id===a.owner_id))html+=`<article class="result"><h3>🐾 ${esc(a.name)}</h3><p>${esc(a.species)} · ${esc(a.breed||'السلالة غير مسجلة')}</p><p class="muted">المالك: ${esc(a.clinic_owners?.full_name||'—')} · ${esc(a.clinic_owners?.phone||'')}</p>${animalButton(a)}</article>`}
 $('results').innerHTML=html||'<div class="empty">لا توجد نتائج مطابقة.</div>';$('results').querySelectorAll('[data-animal]').forEach(b=>b.addEventListener('click',()=>showAnimal(b.dataset.animal)));$('results').querySelectorAll('[data-delete-animal]').forEach(b=>b.addEventListener('click',()=>deleteAnimal(b.dataset.deleteAnimal,b)));$('results').querySelectorAll('[data-delete-owner]').forEach(b=>b.addEventListener('click',()=>deleteOwner(b.dataset.deleteOwner,b)));$('results').querySelectorAll('[data-edit-owner]').forEach(b=>b.addEventListener('click',()=>editOwner(b.dataset.editOwner,b)));$('results').querySelectorAll('[data-edit-animal]').forEach(b=>b.addEventListener('click',()=>editAnimal(b.dataset.editAnimal,b)));
 }catch(e){msg($('appMessage'),'تعذر البحث: '+(e.message||e));$('results').innerHTML='<div class="empty">تحقق من اتصال قاعدة البيانات وصلاحيات الجداول.</div>'}}
function animalButton(a){return `<div class="actions"><button type="button" class="btn secondary" data-animal="${esc(a.id)}">فتح سجل ${esc(a.name)}</button><button type="button" class="btn secondary" data-edit-animal="${esc(a.id)}">تعديل بيانات الحيوان</button><button type="button" class="btn danger" data-delete-animal="${esc(a.id)}">حذف ملف ${esc(a.name)}</button></div>`}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();runSearch($('query').value.trim())});$('showAll').addEventListener('click',()=>runSearch('',true));
async function showAnimal(id){clearMsg($('appMessage'));try{const {data:a,error}=await sb.from('clinic_animals').select('*, clinic_owners(*)').eq('id',id).single();if(error)throw error;const {data:visits,error:ve}=await sb.from('clinic_visits').select('*, clinic_treatments(*)').eq('animal_id',id).order('visit_date',{ascending:false});if(ve)throw ve;
 let html=`<div class="result"><h3>🐾 ${esc(a.name)}</h3><p><b>النوع:</b> ${esc(a.species||'—')} &nbsp; <b>السلالة:</b> ${esc(a.breed||'—')} &nbsp; <b>الجنس:</b> ${esc(a.sex||'—')}</p><p><b>العمر:</b> ${esc(a.age_text||a.birth_date||'—')} &nbsp; <b>الوزن:</b> ${esc(a.weight_kg??'—')} كجم</p><p><b>اللون:</b> ${esc(a.color||'—')}</p><hr><h3>بيانات المالك</h3><p>${esc(a.clinic_owners?.full_name||'—')} · ${esc(a.clinic_owners?.phone||'لا يوجد هاتف')}</p><p>${esc(a.clinic_owners?.address||'')}</p><div class="actions"><button type="button" class="btn secondary" data-edit-animal="${esc(a.id)}">تعديل بيانات الحيوان</button><button type="button" class="btn secondary" data-edit-owner="${esc(a.clinic_owners?.id||"")}">تعديل بيانات المالك</button><button type="button" class="btn danger" data-delete-animal="${esc(a.id)}">حذف ملف الحيوان وكل كشوفاته</button></div></div><h3>سجل الكشوفات والعلاج</h3>`;
 if(!visits?.length)html+='<div class="empty">لا توجد كشوفات مسجلة لهذا الحيوان.</div>';
 for(const v of visits||[]){html+=`<div class="history-item"><h4>${esc(v.visit_type||'كشف جديد')} — ${esc(v.visit_date?new Date(v.visit_date).toLocaleString('ar-EG'):'تاريخ غير مسجل')}</h4>${v.complaint?`<p><b>الشكوى:</b> ${esc(v.complaint)}</p>`:''}${v.history?`<p><b>التاريخ المرضي:</b> ${esc(v.history)}</p>`:''}${v.examination?`<p><b>الفحص:</b> ${esc(v.examination)}</p>`:''}${v.diagnosis?`<p><b>التشخيص:</b> ${esc(v.diagnosis)}</p>`:''}${v.temperature_c?`<p><b>الحرارة:</b> ${esc(v.temperature_c)} °C</p>`:''}${v.notes?`<p><b>ملاحظات:</b> ${esc(v.notes)}</p>`:''}${v.follow_up_date?`<p><b>المتابعة:</b> ${esc(v.follow_up_date)}</p>`:''}${v.clinic_treatments?.length?'<b>العلاج:</b><ul>'+v.clinic_treatments.map(t=>`<li>${esc(t.medication||'دواء')} — الجرعة: ${esc(t.dose||'—')}، الطريقة: ${esc(t.route||'—')}، التكرار: ${esc(t.frequency||'—')}، المدة: ${esc(t.duration||'—')} ${t.instructions?`(${esc(t.instructions)})`:''}</li>`).join('')+'</ul>':''}<div class="actions"><button type="button" class="btn secondary" data-edit-visit="${esc(v.id)}" data-animal-id="${esc(id)}">تعديل الزيارة</button><button type="button" class="btn danger" data-delete-visit="${esc(v.id)}" data-animal-id="${esc(id)}">حذف هذه الزيارة والعلاج المرتبط بها</button></div></div>`}
 $('details').innerHTML=html;$('details').querySelectorAll('[data-edit-animal]').forEach(b=>b.addEventListener('click',()=>editAnimal(b.dataset.editAnimal,b)));$('details').querySelectorAll('[data-edit-owner]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.editOwner)editOwner(b.dataset.editOwner,b)}));$('details').querySelectorAll('[data-delete-animal]').forEach(b=>b.addEventListener('click',()=>deleteAnimal(b.dataset.deleteAnimal,b)));$('details').querySelectorAll('[data-edit-visit]').forEach(b=>b.addEventListener('click',()=>editVisit(b.dataset.editVisit,b.dataset.animalId,b)));$('details').querySelectorAll('[data-delete-visit]').forEach(b=>b.addEventListener('click',()=>deleteVisit(b.dataset.deleteVisit,b.dataset.animalId,b)));$('detailsCard').classList.remove('hidden');$('detailsCard').scrollIntoView({behavior:'smooth',block:'start'});
 }catch(e){msg($('appMessage'),'تعذر فتح السجل: '+(e.message||e))}}

function askField(label,current=''){const v=prompt(label,current??'');return v===null?undefined:(v.trim()===''?null:v.trim())}
async function editOwner(id,button){
 try{
  const {data:o,error}=await sb.from('clinic_owners').select('*').eq('id',id).single();if(error)throw error;
  const full_name=askField('اسم المالك:',o.full_name);if(full_name===undefined)return;if(!full_name)throw new Error('اسم المالك لا يمكن أن يكون فارغًا.');
  const phone=askField('رقم الهاتف:',o.phone||'');if(phone===undefined)return;
  const address=askField('العنوان:',o.address||'');if(address===undefined)return;
  const notes=askField('ملاحظات المالك:',o.notes||'');if(notes===undefined)return;
  if(button)button.disabled=true;
  const {error:ue}=await sb.from('clinic_owners').update({full_name,phone,address,notes}).eq('id',id);if(ue)throw ue;
  msg($('appMessage'),'تم تعديل بيانات المالك بنجاح.','success');await runSearch(lastSearchTerm,lastSearchAll);
 }catch(e){msg($('appMessage'),'تعذر تعديل المالك: '+(e.message||e))}finally{if(button)button.disabled=false}
}
async function editAnimal(id,button){
 try{
  const {data:a,error}=await sb.from('clinic_animals').select('*').eq('id',id).single();if(error)throw error;
  const name=askField('اسم الحيوان:',a.name);if(name===undefined)return;if(!name)throw new Error('اسم الحيوان لا يمكن أن يكون فارغًا.');
  const species=askField('النوع:',a.species||'');if(species===undefined)return;
  const breed=askField('السلالة:',a.breed||'');if(breed===undefined)return;
  const sex=askField('الجنس (ذكر/أنثى/اتركه فارغًا):',a.sex||'');if(sex===undefined)return;
  const birth_date=askField('تاريخ الميلاد YYYY-MM-DD:',a.birth_date||'');if(birth_date===undefined)return;
  const age_text=askField('العمر النصي:',a.age_text||'');if(age_text===undefined)return;
  const weight=askField('الوزن بالكيلو:',a.weight_kg==null?'':String(a.weight_kg));if(weight===undefined)return;
  const color=askField('اللون:',a.color||'');if(color===undefined)return;
  const notes=askField('ملاحظات الحيوان:',a.notes||'');if(notes===undefined)return;
  if(button)button.disabled=true;
  const {error:ue}=await sb.from('clinic_animals').update({name,species,breed,sex,birth_date,age_text,weight_kg:weight?Number(weight):null,color,notes}).eq('id',id);if(ue)throw ue;
  msg($('appMessage'),'تم تعديل بيانات الحيوان بنجاح.','success');await showAnimal(id);await runSearch(lastSearchTerm,lastSearchAll);
 }catch(e){msg($('appMessage'),'تعذر تعديل الحيوان: '+(e.message||e))}finally{if(button)button.disabled=false}
}
async function editVisit(id,animalId,button){
 try{
  const {data:v,error}=await sb.from('clinic_visits').select('*').eq('id',id).single();if(error)throw error;
  const visit_type=askField('نوع الزيارة (كشف جديد/متابعة):',v.visit_type||'كشف جديد');if(visit_type===undefined)return;
  if(visit_type && !['كشف جديد','متابعة'].includes(visit_type))throw new Error('اكتب النوع بالضبط: كشف جديد أو متابعة.');
  const visit_date=askField('تاريخ ووقت الزيارة ISO أو اتركه كما هو:',v.visit_date||'');if(visit_date===undefined)return;
  const complaint=askField('الشكوى الرئيسية:',v.complaint||'');if(complaint===undefined)return;
  const history=askField('التاريخ المرضي والأعراض:',v.history||'');if(history===undefined)return;
  const examination=askField('الفحص السريري والنتائج:',v.examination||'');if(examination===undefined)return;
  const diagnosis=askField('التشخيص:',v.diagnosis||'');if(diagnosis===undefined)return;
  const temp=askField('درجة الحرارة °C:',v.temperature_c==null?'':String(v.temperature_c));if(temp===undefined)return;
  const weight=askField('الوزن وقت الزيارة بالكيلو:',v.weight_kg==null?'':String(v.weight_kg));if(weight===undefined)return;
  const follow_up_date=askField('موعد المتابعة YYYY-MM-DD:',v.follow_up_date||'');if(follow_up_date===undefined)return;
  const notes=askField('ملاحظات الزيارة:',v.notes||'');if(notes===undefined)return;
  if(button)button.disabled=true;
  let normalizedDate=visit_date;
  if(visit_date && !Number.isNaN(Date.parse(visit_date)))normalizedDate=new Date(visit_date).toISOString();
  const {error:ue}=await sb.from('clinic_visits').update({visit_type:visit_type||'كشف جديد',visit_date:normalizedDate||new Date().toISOString(),complaint,history,examination,diagnosis,temperature_c:temp?Number(temp):null,weight_kg:weight?Number(weight):null,follow_up_date,notes}).eq('id',id);if(ue)throw ue;
  msg($('appMessage'),'تم تعديل الزيارة بنجاح.','success');await showAnimal(animalId);
 }catch(e){msg($('appMessage'),'تعذر تعديل الزيارة: '+(e.message||e))}finally{if(button)button.disabled=false}
}

function deleteFailure(e){const details=e?.message||String(e);if(/permission|row.level security|policy|not authorized/i.test(details))return 'تعذر الحذف بسبب صلاحيات قاعدة البيانات. تأكد من تفعيل صلاحية DELETE للمستخدم المسجل في Supabase.';return 'تعذر حذف البيانات: '+details}
async function deleteVisit(visitId,animalId,button){if(!confirm('هل تريد حذف هذا الكشف والعلاج المرتبط به نهائيًا؟'))return;button.disabled=true;try{const {data,error}=await sb.from('clinic_visits').delete().eq('id',visitId).select('id');if(error)throw error;if(!data?.length)throw new Error('لم تُحذف البيانات. تحقق من صلاحية DELETE للمستخدم المسجل.');await showAnimal(animalId);msg($('appMessage'),'تم حذف الكشف والعلاج المرتبط به.','success')}catch(e){msg($('appMessage'),deleteFailure(e))}finally{button.disabled=false}}
async function deleteAnimal(animalId,button){if(!confirm('سيتم حذف ملف الحيوان وجميع كشوفاته والعلاجات المرتبطة به نهائيًا. هل تريد المتابعة؟'))return;button.disabled=true;try{const {data,error}=await sb.from('clinic_animals').delete().eq('id',animalId).select('id');if(error)throw error;if(!data?.length)throw new Error('لم تُحذف البيانات. تحقق من صلاحية DELETE للمستخدم المسجل.');$('detailsCard').classList.add('hidden');await runSearch(lastSearchTerm,lastSearchAll);msg($('appMessage'),'تم حذف ملف الحيوان وكشوفاته وعلاجاته.','success')}catch(e){msg($('appMessage'),deleteFailure(e))}finally{button.disabled=false}}
async function deleteOwner(ownerId,button){if(!confirm('هل تريد حذف بيانات المالك نهائيًا؟ لا يمكن حذفها ما دامت هناك ملفات حيوانات مرتبطة به.'))return;button.disabled=true;try{const {data:animals,error:checkError}=await sb.from('clinic_animals').select('id').eq('owner_id',ownerId).limit(1);if(checkError)throw checkError;if(animals?.length){msg($('appMessage'),'لا يمكن حذف المالك الآن. احذف ملفات الحيوانات المرتبطة به أولًا.');return}const {data,error}=await sb.from('clinic_owners').delete().eq('id',ownerId).select('id');if(error)throw error;if(!data?.length)throw new Error('لم تُحذف البيانات. تحقق من صلاحية DELETE للمستخدم المسجل.');await runSearch(lastSearchTerm,lastSearchAll);msg($('appMessage'),'تم حذف بيانات المالك.','success')}catch(e){msg($('appMessage'),deleteFailure(e))}finally{button.disabled=false}}
</script></body></html>
