<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البحث — Allam Veterinary Clinic</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body>
<button id="themeToggle" class="theme-toggle" type="button" aria-label="تفعيل الوضع الليلي" title="تفعيل الوضع الليلي">☀️</button>
<div id="loginView" class="login-wrap"><section class="card"><img class="clinic-logo" src="logo.png" alt="Allam Veterinary Clinic logo"><h1>البحث في ملفات العيادة</h1><p class="muted">سجّل الدخول للوصول إلى السجلات.</p><div id="loginMessage" class="message"></div><form id="loginForm"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button class="btn" type="submit">تسجيل الدخول</button></div></form></section></div>
<div id="appView" class="hidden"><header><div class="header-brand"><img class="header-logo" src="logo.png" alt="شعار Allam Veterinary Clinic"><div><h1>Allam Veterinary Clinic</h1><p>البحث في ملفات الملاك والحيوانات وسجل الزيارات</p></div></div><nav class="nav"><a href="index.html">الرئيسية</a><a class="active" href="search.html">البحث والسجلات</a><button id="logoutBtn" type="button">تسجيل الخروج</button></nav></header>
<main><div id="appMessage" class="message"></div><section class="card"><h2>البحث عن مالك أو حيوان</h2><form id="searchForm"><label for="query">اسم المالك أو رقم الهاتف أو اسم الحيوان</label><input id="query" placeholder="مثال: أحمد أو 010... أو سيمبا" required><div class="actions"><button class="btn" type="submit">بحث</button><button class="btn secondary" id="showAll" type="button">عرض أحدث الملفات</button></div></form></section><section class="card"><h2>النتائج</h2><div id="results" class="results"><div class="empty">اكتب كلمة للبحث أو اضغط «عرض أحدث الملفات».</div></div></section><section id="detailsCard" class="card hidden"><h2>سجل الحيوان</h2><div id="details"></div></section></main><footer>Allam Veterinary Clinic · البحث والسجلات</footer></div>
<script>
const SUPABASE_URL='https://jydptxycpptbgvgpmaoh.supabase.co';const SUPABASE_KEY='sb_publishable_BWVDzzvaa7Wl27HpIo8etA_p32nc8FZ';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storage:window.sessionStorage}});
const $=id=>document.getElementById(id);
function msg(el,text,type='error'){el.textContent=text;el.className='message '+type;el.style.display='block'}function clearMsg(el){el.textContent='';el.className='message';el.style.display='none'}function setLoggedIn(yes){$('loginView').classList.toggle('hidden',yes);$('appView').classList.toggle('hidden',!yes)}
(function(){const root=document.documentElement,b=$('themeToggle'),key='allam-vet-theme';let t='light';try{t=localStorage.getItem(key)||'light'}catch(e){}function apply(v){root.dataset.theme=v;b.textContent=v==='dark'?'🌙':'☀️';b.title=v==='dark'?'تفعيل الوضع الفاتح':'تفعيل الوضع الليلي';b.setAttribute('aria-label',b.title)}apply(t==='dark'?'dark':'light');b.onclick=()=>{const n=root.dataset.theme==='dark'?'light':'dark';apply(n);try{localStorage.setItem(key,n)}catch(e){}}})();
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();clearMsg($('loginMessage'));const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg($('loginMessage'),'تعذر تسجيل الدخول: '+error.message);return}setLoggedIn(true)});
$('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut({scope:'local'});setLoggedIn(false)});
sb.auth.getSession().then(({data,error})=>setLoggedIn(!error&&!!data.session));sb.auth.onAuthStateChange((_event,session)=>setLoggedIn(!!session));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function runSearch(term,all=false){clearMsg($('appMessage'));$('results').innerHTML='<div class="empty">جارٍ البحث...</div>';$('detailsCard').classList.add('hidden');try{
 let oq=sb.from('clinic_owners').select('*').order('created_at',{ascending:false}).limit(100),aq=sb.from('clinic_animals').select('*, clinic_owners(*)').order('created_at',{ascending:false}).limit(100);
 if(!all){const safe=term.replace(/[,%()]/g,' ').trim();oq=oq.or(`full_name.ilike.%${safe}%,phone.ilike.%${safe}%`);aq=aq.ilike('name',`%${safe}%`)}
 const [or,ar]=await Promise.all([oq,aq]);if(or.error)throw or.error;if(ar.error)throw ar.error;const owners=or.data||[],animals=ar.data||[];let html='';
 for(const o of owners){const related=animals.filter(a=>a.owner_id===o.id);html+=`<article class="result"><h3>👤 ${esc(o.full_name)}</h3><div>${o.phone?`<span class="pill">📞 ${esc(o.phone)}</span>`:''}${o.address?`<span class="pill">${esc(o.address)}</span>`:''}</div><p class="muted">الحيوانات الظاهرة في النتائج: ${related.length}</p>${related.map(animalButton).join('')}</article>`}
 for(const a of animals){if(!owners.some(o=>o.id===a.owner_id))html+=`<article class="result"><h3>🐾 ${esc(a.name)}</h3><p>${esc(a.species)} · ${esc(a.breed||'السلالة غير مسجلة')}</p><p class="muted">المالك: ${esc(a.clinic_owners?.full_name||'—')} · ${esc(a.clinic_owners?.phone||'')}</p>${animalButton(a)}</article>`}
 $('results').innerHTML=html||'<div class="empty">لا توجد نتائج مطابقة.</div>';$('results').querySelectorAll('[data-animal]').forEach(b=>b.addEventListener('click',()=>showAnimal(b.dataset.animal)));
 }catch(e){msg($('appMessage'),'تعذر البحث: '+(e.message||e));$('results').innerHTML='<div class="empty">تحقق من اتصال قاعدة البيانات وصلاحيات الجداول.</div>'}}
function animalButton(a){return `<button type="button" class="btn secondary" data-animal="${esc(a.id)}">فتح سجل ${esc(a.name)}</button>`}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();runSearch($('query').value.trim())});$('showAll').addEventListener('click',()=>runSearch('',true));
async function showAnimal(id){clearMsg($('appMessage'));try{const {data:a,error}=await sb.from('clinic_animals').select('*, clinic_owners(*)').eq('id',id).single();if(error)throw error;const {data:visits,error:ve}=await sb.from('clinic_visits').select('*, clinic_treatments(*)').eq('animal_id',id).order('visit_date',{ascending:false});if(ve)throw ve;
 let html=`<div class="result"><h3>🐾 ${esc(a.name)}</h3><p><b>النوع:</b> ${esc(a.species||'—')} &nbsp; <b>السلالة:</b> ${esc(a.breed||'—')} &nbsp; <b>الجنس:</b> ${esc(a.sex||'—')}</p><p><b>العمر:</b> ${esc(a.age_text||a.birth_date||'—')} &nbsp; <b>الوزن:</b> ${esc(a.weight_kg??'—')} كجم</p><p><b>اللون:</b> ${esc(a.color||'—')}</p><hr><h3>بيانات المالك</h3><p>${esc(a.clinic_owners?.full_name||'—')} · ${esc(a.clinic_owners?.phone||'لا يوجد هاتف')}</p><p>${esc(a.clinic_owners?.address||'')}</p></div><h3>سجل الكشوفات والعلاج</h3>`;
 if(!visits?.length)html+='<div class="empty">لا توجد كشوفات مسجلة لهذا الحيوان.</div>';
 for(const v of visits||[]){html+=`<div class="history-item"><h4>${esc(v.visit_date?new Date(v.visit_date).toLocaleString('ar-EG'):'تاريخ غير مسجل')}</h4>${v.complaint?`<p><b>الشكوى:</b> ${esc(v.complaint)}</p>`:''}${v.history?`<p><b>التاريخ المرضي:</b> ${esc(v.history)}</p>`:''}${v.examination?`<p><b>الفحص:</b> ${esc(v.examination)}</p>`:''}${v.diagnosis?`<p><b>التشخيص:</b> ${esc(v.diagnosis)}</p>`:''}${v.temperature_c?`<p><b>الحرارة:</b> ${esc(v.temperature_c)} °C</p>`:''}${v.notes?`<p><b>ملاحظات:</b> ${esc(v.notes)}</p>`:''}${v.follow_up_date?`<p><b>المتابعة:</b> ${esc(v.follow_up_date)}</p>`:''}${v.clinic_treatments?.length?'<b>العلاج:</b><ul>'+v.clinic_treatments.map(t=>`<li>${esc(t.medication||'دواء')} — الجرعة: ${esc(t.dose||'—')}، الطريقة: ${esc(t.route||'—')}، التكرار: ${esc(t.frequency||'—')}، المدة: ${esc(t.duration||'—')} ${t.instructions?`(${esc(t.instructions)})`:''}</li>`).join('')+'</ul>':''}</div>`}
 $('details').innerHTML=html;$('detailsCard').classList.remove('hidden');$('detailsCard').scrollIntoView({behavior:'smooth',block:'start'});
 }catch(e){msg($('appMessage'),'تعذر فتح السجل: '+(e.message||e))}}
</script></body></html>
